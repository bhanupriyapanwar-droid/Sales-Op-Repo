name: Mirror Selected Branch to GitLab

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to mirror to GitLab'
        required: true
        default: 'main'
        type: string

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret length
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          echo "GITLAB_TOKEN length: ${#GL_TOKEN}"

      - name: Test token directly against GitLab
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            -H "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            "https://codevault.cyntexa.com/api/v4/projects/bhanupriyapanwar%2Fgithub-to-gitlab"

      - name: Mirror selected branch to GitLab (full history)
        run: |
          echo "Mirroring branch: ${{ github.event.inputs.branch }}"
          git clone --branch "${{ github.event.inputs.branch }}" --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo-mirror
          cd repo-mirror
          git push https://oauth2:${{ secrets.GITLAB_TOKEN }}@codevault.cyntexa.com/bhanupriyapanwar/github-to-gitlab.git "${{ github.event.inputs.branch }}" --force
